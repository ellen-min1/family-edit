<style>

:root{
  --paper:#FFFFFF;
  --ink:#17140F;
  --ink-soft:#6B655C;
  --ink-faint:#A29C90;
  --accent:#3D4A34;
  --accent-pale:#EEF0E9;
  --line:#E5E2DC;

  --tag-ongoing-bg:#E8EDE2;
  --tag-ongoing-ink:#4F6238;
  --tag-monthly-bg:#EDE6EE;
  --tag-monthly-ink:#6F4A70;
  --tag-weekly-bg:#E4EAF1;
  --tag-weekly-ink:#415B80;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo', sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
}
a{color:var(--ink);}

.shell{max-width:960px;margin:0 auto;padding:0 32px 140px;}
header.top{
  padding:44px 32px 0;
  max-width:960px;
  margin:0 auto;
  border-bottom:1px solid var(--ink);
  padding-bottom:24px;
}
.masthead{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:end;
  gap:20px;
}
.masthead .eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.masthead .title{
  font-family:'Archivo Expanded', sans-serif;
  font-weight:800;
  font-size:34px;
  letter-spacing:-0.01em;
  text-transform:uppercase;
  line-height:0.95;
}
.masthead .dateline{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  text-align:right;
  line-height:1.6;
}
.logo-block{
  display:inline-block;
  text-decoration:none;
}
.logo-mark{
  display:block;
  height:72px;
  width:auto;
}
.logo-tagline{
  display:block;
  margin-top:8px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--accent);
}
@media (max-width:640px){
  .logo-mark{ height:52px; }
  .logo-tagline{ font-size:9.5px; letter-spacing:0.1em; margin-top:6px; }
}

.newsletter-bar{
  background:var(--paper);
  border-bottom:1px solid var(--ink);
}
.newsletter-bar-inner{
  max-width:960px;
  margin:0 auto;
  padding:16px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.newsletter-copy{
  font-size:12px;
  font-weight:600;
  letter-spacing:0.02em;
  color:var(--ink-soft);
}
.newsletter-cta{
  flex:none;
  font-family:'Archivo', sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--paper);
  background:var(--accent);
  padding:9px 18px;
  text-decoration:none;
  white-space:nowrap;
  transition:background .15s ease;
}
.newsletter-cta:hover{ background:var(--ink); }

.status-banner{
  display:none;
  background:var(--accent-pale);
  border-bottom:1px solid var(--ink);
}
.status-banner.active{ display:block; }
.status-banner-inner{
  max-width:960px;
  margin:0 auto;
  padding:14px 32px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.01em;
  color:var(--accent);
}
.status-dot{
  width:7px;
  height:7px;
  flex:none;
  background:var(--accent);
  animation:statusPulse 1.6s ease-in-out infinite;
}
@keyframes statusPulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

nav.tabs{
  display:flex;
  gap:0;
  margin:0 0 56px;
}
nav.tabs button{
  font-family:'Archivo', sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.12em;
  text-transform:uppercase;
  background:transparent;
  border:none;
  border-right:1px solid var(--line);
  color:var(--ink-faint);
  padding:16px 24px 16px 0;
  margin-right:24px;
  cursor:pointer;
  transition:color .15s ease;
}
nav.tabs button:last-child{ border-right:none; }
nav.tabs button:hover{ color:var(--ink); }
nav.tabs button.active{ color:var(--accent); }

.view{display:none;}
.view.active{display:block; animation:fade .3s ease;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}

.section-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink);
  margin:0 0 24px;
  padding-bottom:12px;
  border-bottom:1px solid var(--ink);
}

.three-see{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  margin-bottom:72px;
  border:1px solid var(--line);
}
@media (max-width:760px){ .three-see{grid-template-columns:1fr;} }
.three-see.empty{ grid-template-columns:1fr; }
.see-card{
  padding:28px 24px;
  border-right:1px solid var(--line);
}
.see-card:last-child{ border-right:none; }
.see-card .num{
  font-family:'Archivo Expanded', sans-serif;
  font-weight:800;
  font-size:12px;
  color:var(--accent);
  margin-bottom:16px;
  letter-spacing:0.05em;
}
.see-card h3{
  font-size:19px;
  font-weight:700;
  margin:0 0 10px;
  line-height:1.25;
}
.see-card h3 a{color:var(--ink); text-decoration:none;}
.see-card h3 a:hover{color:var(--accent);}
.see-card p{
  font-size:13px;
  color:var(--ink-soft);
  margin:0;
  line-height:1.55;
}
.see-card.empty-state{
  padding:36px 24px;
}
.see-card.empty-state .empty-title{
  display:block;
  font-family:'Archivo Expanded', sans-serif;
  font-weight:800;
  font-size:17px;
  text-transform:uppercase;
  letter-spacing:-0.005em;
  color:var(--ink);
  margin-bottom:8px;
}

.region-block{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:24px;
  margin-bottom:0;
  border-top:1px solid var(--ink);
  padding:28px 0;
}
@media (max-width:640px){ .region-block{grid-template-columns:1fr;} }
.region-title{
  font-family:'Archivo Expanded', sans-serif;
  font-weight:800;
  font-size:16px;
  text-transform:uppercase;
  letter-spacing:-0.005em;
  margin:0 0 4px;
  color:var(--ink);
}
.region-title .sf-label{
  display:block;
  font-family:'Archivo', sans-serif;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-faint);
  margin-top:4px;
}
.region-count{
  font-size:11px;
  font-weight:600;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:0.05em;
}

.event-row{
  padding:16px 0;
  border-bottom:1px solid var(--line);
}
.event-row:last-child{ border-bottom:none; padding-bottom:0; }
.event-row:first-child{ padding-top:0; }
.event-body h4{
  margin:0 0 6px;
  font-size:15.5px;
  font-weight:700;
  display:inline;
}
.event-body h4 a{text-decoration:none; color:var(--ink);}
.event-body h4 a:hover{color:var(--accent);}
.event-tag{
  display:inline-block;
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.06em;
  padding:2px 7px;
  margin-left:8px;
  vertical-align:middle;
}
.event-tag.ongoing{ color:var(--tag-ongoing-ink); background:var(--tag-ongoing-bg); }
.event-tag.monthly{ color:var(--tag-monthly-ink); background:var(--tag-monthly-bg); }
.event-tag.weekly{  color:var(--tag-weekly-ink);  background:var(--tag-weekly-bg); }
.event-desc{
  font-size:13px;
  color:var(--ink-soft);
  margin:6px 0 8px;
  line-height:1.5;
}
.event-meta{
  font-size:11.5px;
  font-weight:600;
  color:var(--ink-soft);
  display:flex;
  flex-wrap:wrap;
  gap:2px 20px;
  text-transform:uppercase;
  letter-spacing:0.02em;
}
.event-meta .k{ color:var(--ink-faint); font-weight:700; margin-right:4px; }

#map{
  height:480px;
  border:1px solid var(--ink);
  margin-bottom:16px;
  filter:grayscale(0.55) contrast(1.03);
}
.leaflet-popup-content{font-family:'Archivo', sans-serif; font-size:13px;}
.leaflet-popup-content b{font-weight:800; font-size:14px;}
.map-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 20px;
  margin-bottom:10px;
}
.legend-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--ink-soft);
}
.legend-chip i{
  width:9px; height:9px;
  display:inline-block;
}
.map-legend-note{
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--ink-faint);
}

</style>
</head>

const REGION_ORDER = ["Central","Southeast","Northeast","North","West","East Bay","Peninsula","South Bay","North Bay"];
const SF_REGIONS = new Set(["Central","Southeast","Northeast","North","West"]);

const DAY_RANK = { "fri":0, "sat":1, "sun":2 };

function dayRank(day){
  const first = day.toLowerCase().slice(0,3);
  return DAY_RANK[first] !== undefined ? DAY_RANK[first] : 9;
}
function sortEvents(list){
  return list.slice().sort((a,b)=>
    dayRank(a.day) - dayRank(b.day) ||
    (a.startMin ?? 9999) - (b.startMin ?? 9999)
  );
}

if(SITE_UPDATING){
  document.getElementById('statusBanner').classList.add('active');
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-"+btn.dataset.view).classList.add("active");
    if(btn.dataset.view==="map"){ setTimeout(()=>{ if(window._leafletMap) window._leafletMap.invalidateSize(); },50); }
  });
});

function renderThreeToSee(){
  const container = document.getElementById("threeSee");
  if(!container) return;
  if(!THREE_TO_SEE.length){
    container.classList.add("empty");
    container.innerHTML = `<div class="see-card empty-state"><span class="empty-title">Fresh Picks Coming Soon</span><p>We're gathering next weekend's best family events — check back soon for the full lineup.</p></div>`;
    return;
  }
  container.innerHTML = THREE_TO_SEE.map((e,i)=>`
    <div class="see-card">
      <div class="num">0${i+1}</div>
      <h3><a href="${e.link}" target="_blank" rel="noopener">${e.title}</a></h3>
      <p>${e.teaser}</p>
    </div>
  `).join("");
}
renderThreeToSee();

function renderRegions(){
  const container = document.getElementById("region-blocks");
  if(!container) return;
  const byRegion = {};
  EVENTS.forEach(e=>{ (byRegion[e.region] = byRegion[e.region]||[]).push(e); });

  REGION_ORDER.filter(r=>byRegion[r]).forEach(region=>{
    const block = document.createElement("div");
    block.className = "region-block";
    const sfLabel = SF_REGIONS.has(region) ? `<span class="sf-label">San Francisco</span>` : '';
    const left = document.createElement("div");
    left.className = "region-title-col";
    left.innerHTML = `<h3 class="region-title">${region}${sfLabel}</h3><span class="region-count">${byRegion[region].length} Event${byRegion[region].length>1?'s':''}</span>`;
    const right = document.createElement("div");
    sortEvents(byRegion[region]).forEach(e=>{
      const row = document.createElement("div");
      row.className = "event-row";
      const dayLabel = e.dayDisplay || e.day;
      row.innerHTML = `
        <div class="event-body">
          <h4><a href="${e.link}" target="_blank" rel="noopener">${e.title}</a></h4>${e.tag ? `<span class="event-tag ${e.tag.toLowerCase()}">${e.tag}</span>` : ''}
          <p class="event-desc">${e.desc}</p>
          <div class="event-meta">
            <span><span class="k">When</span>${dayLabel}, ${e.time}</span>
            <span><span class="k">Where</span>${e.venue} — ${e.neighborhood}</span>
            <span><span class="k">Cost</span>${e.price}</span>
          </div>
        </div>`;
      right.appendChild(row);
    });
    block.appendChild(left);
    block.appendChild(right);
    container.appendChild(block);
  });
}
renderRegions();

const categoryColors = {
  "Festivals & Fairs":"#E8380D",
  "Movie Nights":"#6A2FD1",
  "Performances & Shows":"#E8A400",
  "Science & Museums":"#00A19B",
  "Music & Dance":"#D6127A",
  "Sports & Watch Parties":"#1257D6"
};
const map = L.map('map', {scrollWheelZoom:false}).setView([37.72,-122.15], 10);
window._leafletMap = map;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; OpenStreetMap contributors', maxZoom:19, subdomains:'abc'
}).addTo(map);

EVENTS.forEach(e=>{
  const color = categoryColors[e.category] || "#17140F";
  const marker = L.circleMarker([e.lat,e.lng], {
    radius:8, color:"#FFFFFF", weight:2.5, fillColor:color, fillOpacity:1
  }).addTo(map);
  const dayLabel = e.dayDisplay || e.day;
  marker.bindPopup(`<b>${e.title}</b><br><span style="color:${color}; font-weight:700;">${e.category}</span><br>${dayLabel}, ${e.date} · ${e.time}<br>${e.venue} — ${e.neighborhood}<br>${e.price}<br><a href="${e.link}" target="_blank" rel="noopener">Event page →</a>`);
});

const legendEl = document.getElementById("mapLegend");
legendEl.innerHTML = Object.entries(categoryColors).map(([cat,color])=>
  `<span class="legend-chip"><i style="background:${color}"></i>${cat}</span>`
).join("");

document.getElementById("mapLegendNote").textContent = `${EVENTS.length} Spots — Fri Oct 9 – Sun Oct 11, 2026`;
